<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #player {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

    <div id="player"></div>

    <script>
        let player = null;
        let apiReady = false;
        let pendingVideoId = null;

        function postMessage(type, value) {
            try {
                if (window.chrome &&
                    window.chrome.webview) {
                    window.chrome.webview.postMessage(
                        JSON.stringify(
                            {
                                type: type,
                                value: value
                            }));
                }
            }
            catch (error) {
            }
        }

        function onYouTubeIframeAPIReady() {
            apiReady = true;

            createPlayer();
        }

        function createPlayer() {
            if (!apiReady ||
                player) {
                return;
            }

            player =
                new YT.Player(
                    "player",
                    {
                        width: "200",
                        height: "200",

                        playerVars:
                        {
                            autoplay: 0,
                            controls: 0,
                            disablekb: 1,
                            fs: 0,
                            playsinline: 1,
                            rel: 0,
                            origin: "https://oakmusic.local"
                        },

                        events:
                        {
                            onReady: onPlayerReady,
                            onStateChange: onPlayerStateChange,
                            onError: onPlayerError,
                            onAutoplayBlocked: onAutoplayBlocked
                        }
                    });
        }

        function onPlayerReady(event) {
            postMessage(
                "ready",
                true);

            if (pendingVideoId) {
                let videoId =
                    pendingVideoId;

                pendingVideoId =
                    null;

                loadAndPlayVideo(
                    videoId);
            }
        }

        function onPlayerStateChange(event) {
            postMessage(
                "state",
                event.data);
        }

        function onPlayerError(event) {
            postMessage(
                "error",
                event.data);
        }

        function onAutoplayBlocked() {
            postMessage(
                "autoplay-blocked",
                true);
        }

        function loadVideo(videoId) {
            if (!player) {
                pendingVideoId =
                    videoId;

                return;
            }

            player.loadVideoById(
                videoId);
        }

        function loadAndPlayVideo(videoId) {
            if (!player) {
                pendingVideoId =
                    videoId;

                return;
            }

            player.loadVideoById(
                videoId);
        }

        function playVideo() {
            if (player) {
                player.playVideo();
            }
        }

        function pauseVideo() {
            if (player) {
                player.pauseVideo();
            }
        }

        function seekVideo(
            seconds,
            allowSeekAhead) {
            if (player) {
                player.seekTo(
                    seconds,
                    allowSeekAhead);
            }
        }

        function getCurrentTime() {
            if (player) {
                return player.getCurrentTime();
            }

            return 0;
        }

        function getDuration() {
            if (player) {
                return player.getDuration();
            }

            return 0;
        }

        function setVolume(volume) {
            if (player) {
                player.setVolume(
                    volume);
            }
        }
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
